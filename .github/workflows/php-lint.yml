name: PHP contracts and lint
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3', '8.5']
    container: php:${{ matrix.php }}-cli
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          find dtr-mcp-bridge tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Isolated PHP contracts
        run: |
          php tests/lifecycle.php
          php tests/elementor.php --code-enabled
